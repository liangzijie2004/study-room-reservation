spring:
  datasource:
    driver-class-name: org.h2.Driver
    # H2 内存库，运行在 MySQL 兼容模式下，避免本地必须安装 MySQL
    url: jdbc:h2:mem:studyroom;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;IGNORECASE=TRUE
    username: sa
    password: ""
  sql:
    init:
      mode: always
      schema-locations: classpath:db/h2/schema.sql
  h2:
    console:
      enabled: true
      path: /h2-console